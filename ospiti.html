<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Punto — Aggiungi task</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#F6F5F2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Punto" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg-primary:#ffffff; --bg-secondary:#f6f5f2; --bg-tertiary:#eeece8; --text-primary:#1a1a18; --text-secondary:#6b6b68; --text-tertiary:#9b9b97; --border-light:rgba(0,0,0,.06); --border-medium:rgba(0,0,0,.14); --radius-sm:8px; --radius-md:12px; --radius-lg:18px; --shadow-sm:0 1px 2px rgba(20,20,18,.04), 0 2px 8px rgba(20,20,18,.05); --shadow-md:0 6px 24px rgba(20,20,18,.07); --green-bg:#EAF3DE; --green-text:#27500A; --red-bg:#FCEBEB; --red-text:#A32D2D; --amber-bg:#FAEEDA; --amber-text:#633806; --blue-bg:#E6F1FB; --blue-text:#185FA5; --info-bg:#E6F1FB; --info-text:#185FA5; }
    @media (prefers-color-scheme: dark) { :root { --bg-primary:#232321; --bg-secondary:#2a2a28; --bg-tertiary:#1a1a18; --text-primary:#f0f0ec; --text-secondary:#a0a09c; --text-tertiary:#6b6b68; --border-light:rgba(255,255,255,.07); --border-medium:rgba(255,255,255,.16); --shadow-sm:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.35); --shadow-md:0 6px 24px rgba(0,0,0,.5); --green-bg:#173404; --green-text:#C0DD97; --red-bg:#501313; --red-text:#F7C1C1; --amber-bg:#412402; --amber-text:#FAC775; --blue-bg:#042C53; --blue-text:#B5D4F4; --info-bg:#042C53; --info-text:#B5D4F4; } }
    html { touch-action:manipulation; overscroll-behavior:none; -webkit-text-size-adjust:100%; text-size-adjust:100%; -webkit-tap-highlight-color:transparent; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg-tertiary); color:var(--text-primary); font-size:15px; line-height:1.55; min-height:100vh; touch-action:manipulation; overscroll-behavior:none; }
    .shell { max-width:640px; margin:0 auto; padding:1.5rem 1rem 4rem; }
    .brand-mark { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:1.5rem; opacity:.45; user-select:none; }
    .brand-dot { width:13px; height:13px; border-radius:50%; background:var(--text-primary); }
    .brand-name { font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:24px; font-weight:500; letter-spacing:.22em; text-indent:.22em; color:var(--text-primary); line-height:1; }
    .section { background:var(--bg-primary); border:.5px solid var(--border-light); border-radius:var(--radius-lg); padding:1.15rem 1.4rem; margin-bottom:1rem; box-shadow:var(--shadow-sm); }
    .section-title { font-size:15px; font-weight:600; color:var(--text-primary); margin-bottom:1rem; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .form-grid { display:grid; grid-template-columns:1fr; gap:12px; align-items:end; }
    .form-group { display:flex; flex-direction:column; gap:4px; }
    .form-group label { font-size:12px; color:var(--text-secondary); font-weight:500; }
    input[type="text"], input[type="date"], select { width:100%; padding:7px 10px; font-size:13px; border:.5px solid var(--border-medium); border-radius:var(--radius-md); background:var(--bg-primary); color:var(--text-primary); outline:none; transition:border-color .15s; }
    input:focus, select:focus { border-color:var(--info-text); box-shadow:0 0 0 3px rgba(24,95,165,.12); }
    @media (pointer:coarse) { input[type="text"], input[type="date"], select { font-size:16px !important; } }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 16px; border-radius:var(--radius-md); border:.5px solid var(--border-medium); background:transparent; cursor:pointer; font-size:14px; font-weight:600; color:var(--text-primary); white-space:nowrap; transition:all .15s; }
    .btn:hover { background:var(--bg-secondary); }
    .btn-primary { background:var(--info-bg); color:var(--info-text); border-color:transparent; box-shadow:var(--shadow-sm); }
    .btn-primary:hover { opacity:.9; background:var(--info-bg); box-shadow:var(--shadow-md); }
    .subtle-text { font-size:12px; color:var(--text-secondary); }
    .empty-state { text-align:center; padding:1.5rem; color:var(--text-tertiary); font-size:13px; }
    .company-list { display:flex; flex-direction:column; gap:6px; }
    .company-item { display:flex; align-items:center; justify-content:space-between; padding:11px 14px; background:var(--bg-secondary); border-radius:var(--radius-md); border:.5px solid var(--border-light); gap:12px; }
    .company-info { display:flex; flex-direction:column; gap:2px; flex:1; min-width:0; }
    .company-name { font-size:14px; font-weight:600; color:var(--text-primary); }
    .company-meta { font-size:12px; color:var(--text-secondary); }
    .status-badge { font-size:11px; padding:3px 9px; border-radius:20px; font-weight:600; white-space:nowrap; background:var(--green-bg); color:var(--green-text); }
    .ac-wrap { position:relative; }
    .ac-box { position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--bg-primary); border:.5px solid var(--border-medium); border-radius:var(--radius-md); box-shadow:var(--shadow-md); z-index:1200; max-height:260px; overflow-y:auto; }
    .ac-item { padding:8px 12px; cursor:pointer; font-size:13px; }
    .ac-item:hover, .ac-item.sel { background:var(--bg-secondary); }
    .ac-main { font-weight:600; }
    .ac-sec { font-size:11px; color:var(--text-secondary); }
    .ac-powered { padding:4px 10px 6px; font-size:10px; color:var(--text-tertiary); text-align:right; }
    .banner { border-radius:var(--radius-md); padding:12px 14px; font-size:13px; margin-bottom:1rem; }
    .banner-err { background:var(--red-bg); color:var(--red-text); }
    #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(60px); background:#18181b; color:#fafaf9; padding:9px 20px; border-radius:24px; font-size:13px; font-weight:500; z-index:9999; opacity:0; pointer-events:none; transition:all .25s cubic-bezier(.16,1,.3,1); white-space:nowrap; }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="brand-mark"><span class="brand-dot"></span><span class="brand-name">PUNTO</span></div>

    <div id="linkError" class="banner banner-err hidden"></div>

    <div class="section" id="formCard">
      <div class="section-title"><i class="ti ti-circle-check"></i> Aggiungi un task</div>
      <div class="form-grid">
        <div class="form-group">
          <label>Nome operatore *</label>
          <input type="text" id="op-nome" placeholder="Es: Mario Bianchi" autocomplete="off" />
        </div>
        <div class="form-group">
          <label>Cosa c'è da fare *</label>
          <input type="text" id="op-titolo" placeholder="Es: Richiamare per il colloquio…" autocomplete="off" />
        </div>
        <div class="form-group">
          <label>Azienda <span class="subtle-text">(facoltativa)</span></label>
          <div class="ac-wrap"><input type="text" id="op-azienda" placeholder="Per chi va fatto…" autocomplete="off" /><div class="ac-box hidden" id="ac-op-azienda"></div></div>
        </div>
        <div class="form-group">
          <label>Scadenza</label>
          <select id="op-scad"><option value="oggi">Oggi</option><option value="domani">Domani</option><option value="settimana">Questa settimana (venerdì)</option><option value="data">Data…</option></select>
        </div>
        <div class="form-group hidden" id="op-data-group"><label>Data</label><input type="date" id="op-data" /></div>
        <button class="btn btn-primary" id="btn-invia"><i class="ti ti-send"></i> Invia task</button>
      </div>
    </div>

    <div class="section" id="sentCard">
      <div class="section-title"><i class="ti ti-history"></i> Inviati adesso</div>
      <div class="company-list" id="sent-list"></div>
      <div class="empty-state" id="sent-empty">Nessun task inviato in questa sessione.</div>
      <div class="subtle-text" style="margin-top:12px;">I task inviati arrivano subito nella lista di lavoro di chi ti ha mandato il link. Da qui non è possibile vedere o modificare i task già presenti.</div>
    </div>
  </div>
  <div id="toast"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getFirestore, collection, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    const GPLACES_KEY = 'AIzaSyCerXMBfDAXiF5tEkkKXHGg0QMy3I1pQic';
    const FC_CENTER = { lat:44.18, lng:12.18 };
    const firebaseConfig = { apiKey:'AIzaSyCerXMBfDAXiF5tEkkKXHGg0QMy3I1pQic', authDomain:'punto-umana.firebaseapp.com', projectId:'punto-umana', storageBucket:'punto-umana.firebasestorage.app', messagingSenderId:'105141488497', appId:'1:105141488497:web:51d2689ba9b8ac425484d0', measurementId:'G-NJZZXM5RF8' };
    const app = initializeApp(firebaseConfig);
    const dbfs = getFirestore(app);

    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const isoOf = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const today = () => isoOf(new Date());
    const addDays = (iso, n) => { const d = new Date((iso || today()) + 'T00:00:00'); d.setDate(d.getDate() + (parseInt(n) || 0)); return isoOf(d); };
    const venerdi = () => { const d = new Date(); return addDays(isoOf(d), (5 - d.getDay() + 7) % 7); };
    const fmtData = d => !d ? '—' : `${d.split('-')[2]}/${d.split('-')[1]}/${d.split('-')[0]}`;
    function showToast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.remove('show'),2600); }

    const params = new URLSearchParams(location.search);
    const ownerUid = (params.get('u') || '').trim();
    const guestToken = (params.get('t') || '').trim();
    if (!ownerUid || !guestToken) {
      $('linkError').textContent = 'Link non valido o incompleto. Chiedi che ti venga inviato di nuovo il link per aggiungere i task.';
      $('linkError').classList.remove('hidden');
      $('formCard').classList.add('hidden');
      $('sentCard').classList.add('hidden');
    }

    // nome operatore ricordato sul dispositivo, così si scrive una volta sola
    try { const memo = localStorage.getItem('punto_operatore'); if (memo) $('op-nome').value = memo; } catch(e){}

    // ── suggerimenti azienda: Google Places con ripiego su OpenStreetMap ──
    const withTimeout=(p,ms)=>Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error('Timeout rete')),ms))]);
    let gplacesOk=null, gplacesToken='', acWarned=false;
    const gplacesHeaders=fm=>({ 'Content-Type':'application/json', 'X-Goog-Api-Key':GPLACES_KEY, ...(fm?{ 'X-Goog-FieldMask':fm }:{}) });
    async function googleSearch(q){ if(!gplacesToken) gplacesToken=crypto.randomUUID(); const r=await withTimeout(fetch('https://places.googleapis.com/v1/places:autocomplete',{ method:'POST', headers:gplacesHeaders('suggestions.placePrediction.placeId,suggestions.placePrediction.structuredFormat,suggestions.placePrediction.text'), body:JSON.stringify({ input:q, languageCode:'it', includedRegionCodes:['it'], sessionToken:gplacesToken, locationBias:{ circle:{ center:{ latitude:FC_CENTER.lat, longitude:FC_CENTER.lng }, radius:30000 } } }) }),8000); if(!r.ok) throw new Error('Google HTTP '+r.status); const data=await r.json(); return (data.suggestions||[]).map(s=>s.placePrediction).filter(Boolean).map(p=>({ fonte:'google', nome:p.structuredFormat?.mainText?.text||p.text?.text||q, main:p.structuredFormat?.mainText?.text||p.text?.text||q, sec:p.structuredFormat?.secondaryText?.text||'' })); }
    function photonLabel(pr){ const via=[pr.street,pr.housenumber].filter(Boolean).join(' '); const loc=[pr.postcode,pr.city||pr.county].filter(Boolean).join(' '); return [via,loc,pr.state].filter(Boolean).join(', '); }
    async function photonSearch(q){ const u=new URL('https://photon.komoot.io/api/'); u.searchParams.set('q',q); u.searchParams.set('limit','6'); u.searchParams.set('lat',FC_CENTER.lat); u.searchParams.set('lon',FC_CENTER.lng); const r=await withTimeout(fetch(u),8000); if(!r.ok) throw new Error('HTTP '+r.status); const data=await r.json(); return (data.features||[]).filter(f=>{ const pr=f.properties||{}; const cc=String(pr.countrycode||'').toUpperCase(); return (cc ? cc==='IT' : /itali|italy/i.test(String(pr.country||''))) && Array.isArray(f.geometry?.coordinates); }).map(f=>{ const pr=f.properties||{}; const indirizzo=photonLabel(pr); return { fonte:'osm', nome:String(pr.name||pr.street||q), main:pr.name||pr.street||q, sec:indirizzo }; }); }
    async function geoSearch(q){ if(gplacesOk!==false){ try{ const items=await googleSearch(q); gplacesOk=true; return items; }catch(err){ gplacesOk=false; console.warn('Google Places non disponibile, uso OpenStreetMap:', err); } } return photonSearch(q); }
    function attachGeoAC(input, box, onPick){ let items=[], sel=-1, timer=null; const hide=()=>{ box.classList.add('hidden'); box.innerHTML=''; items=[]; sel=-1; }; const render=()=>{ box.innerHTML=items.map((s,i)=>`<div class="ac-item ${i===sel?'sel':''}" data-i="${i}"><div class="ac-main">${esc(s.main)}</div>${s.sec?`<div class="ac-sec">${esc(s.sec)}</div>`:''}</div>`).join('')+`<div class="ac-powered">${items[0]?.fonte==='google'?'Powered by Google':'© OpenStreetMap'}</div>`; box.classList.remove('hidden'); box.querySelectorAll('.ac-item').forEach(el=>el.addEventListener('mousedown',e=>{ e.preventDefault(); const s=items[+el.dataset.i]; hide(); if(s) onPick(s); })); }; input.addEventListener('input',()=>{ const q=input.value.trim(); clearTimeout(timer); if(q.length<3) return hide(); timer=setTimeout(async()=>{ try{ const res=await geoSearch(q); if(input.value.trim()!==q) return; items=res; sel=-1; items.length?render():hide(); }catch(err){ console.warn('Suggerimenti non disponibili:', err); if(!acWarned){ acWarned=true; showToast('⚠️ Suggerimenti non disponibili'); } hide(); } },300); }); input.addEventListener('keydown',e=>{ if(box.classList.contains('hidden')) return; if(e.key==='ArrowDown'){ e.preventDefault(); sel=Math.min(sel+1,items.length-1); render(); } else if(e.key==='ArrowUp'){ e.preventDefault(); sel=Math.max(sel-1,0); render(); } else if(e.key==='Enter'&&sel>=0){ e.preventDefault(); const s=items[sel]; hide(); onPick(s); } else if(e.key==='Escape') hide(); }); input.addEventListener('blur',()=>setTimeout(hide,150)); }
    attachGeoAC($('op-azienda'), $('ac-op-azienda'), p=>{ $('op-azienda').value=p.nome; });

    function toggleData(){ const libera=$('op-scad').value==='data'; $('op-data-group').classList.toggle('hidden', !libera); if(libera){ if(!$('op-data').value) $('op-data').value=today(); $('op-data').focus(); } }
    function scadenza(){ const v=$('op-scad').value; if(v==='domani') return addDays(today(),1); if(v==='settimana') return venerdi(); if(v==='data') return $('op-data').value||today(); return today(); }
    $('op-scad').addEventListener('change', toggleData);

    const inviati = [];
    function renderInviati(){ $('sent-empty').style.display = inviati.length ? 'none' : 'block'; $('sent-list').innerHTML = inviati.map(t=>`<div class="company-item"><div class="company-info"><div class="company-name">${esc(t.titolo)}</div><div class="company-meta">${t.azienda?esc(t.azienda)+' · ':''}Scadenza: ${fmtData(t.dueDate)}</div></div><span class="status-badge">Inviato</span></div>`).join(''); }

    let invioInCorso = false;
    async function inviaTask(){
      if (invioInCorso) return;
      const operatore = $('op-nome').value.trim();
      const titolo = $('op-titolo').value.trim();
      if (!operatore) return showToast('⚠️ Scrivi il nome operatore');
      if (!titolo) return showToast('⚠️ Scrivi cosa c’è da fare');
      const azienda = $('op-azienda').value.trim();
      const dueDate = scadenza();
      invioInCorso = true; $('btn-invia').disabled = true;
      try {
        await addDoc(collection(dbfs,'users',ownerUid,'azioni'), {
          tipo:'task', titolo, azienda, aziendaId:null, contatto:'', tipoInvio:null, tipoInvioNota:'',
          dataInvio: today(), dueDate, stato:'da_fare', esito:null, note:'',
          operatore, origine:'ospite', gt: guestToken,
          createdAt: serverTimestamp(), updatedAt: serverTimestamp()
        });
        try { localStorage.setItem('punto_operatore', operatore); } catch(e){}
        inviati.unshift({ titolo, azienda, dueDate });
        renderInviati();
        $('op-titolo').value = '';
        $('op-titolo').focus();
        showToast('✅ Task inviato!');
      } catch (err) {
        console.warn('Invio non riuscito:', err);
        const negato = String(err?.code||'').includes('permission-denied');
        $('linkError').textContent = negato
          ? 'Questo link non è più valido: potrebbe essere stato revocato o non ancora attivato. Chiedi un link aggiornato.'
          : 'Invio non riuscito, controlla la connessione e riprova.';
        $('linkError').classList.remove('hidden');
        showToast(negato ? '⚠️ Link non valido' : '⚠️ Invio non riuscito');
      } finally {
        invioInCorso = false; $('btn-invia').disabled = false;
      }
    }
    $('btn-invia').addEventListener('click', inviaTask);
    $('op-titolo').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); inviaTask(); } });
    renderInviati();
  </script>
</body>
</html>
